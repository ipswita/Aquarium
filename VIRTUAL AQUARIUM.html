 else if(tab=='style'){

 else Object.keys(IT).filter(id=>IT[id].t=={plants:'p',corals:'c',decor:'d'}[tab]).forEach(id=>{const s=IT[id];add(s.n,s.p+' 🪙',0,S.coins<s.p,c=>itemDraw(c,id,17,31,0),()=>{

function update(dt){
 S.t+=dt;night=S.atm=='moon'?.5:AM?cl(Math.sin(S.t/45)*.8,0,.5):0;boost=Math.max(0,boost-dt);bcd=Math.max(0,bcd-dt);if(boost>0&&Math.random()<dt*12)spark(R(8,W-8),R(12,GY),1,'#ffe066');
 gT-=dt;if(!gift&&gT<=0){gift={x:R(16,W-16),y:GY+6,v:Math.round(R(30,70)+S.fish.length*6)};gT=R(22,36);toast('A treasure bubble appeared! 🎁')}
 if(gift){gift.y-=9*dt;gift.x+=Math.sin(S.t*2)*.15;if(gift.y<12)gift=null}
 const nf=S.fish.length,sn=S.fish.filter(f=>f.sp=='snail').length,pl=S.items.filter(i=>IT[i.id].t=='p').length;
 S.clean=cl(S.clean-dt*Math.max(.008,.025+.03*nf-.01*Math.min(pl,6)-.025*sn),0,100);
 for(const f of S.fish){const s=SP[f.sp];f.full=Math.max(0,f.full-dt*.9);f.tt-=dt;
  if(s.g){if(f.tt<=0){f.tx=R(10,W-10);f.ty=R(GY+6,H-6);f.tt=R(3,8)}
   let tg=null,bd=1e9;if(f.full<85)for(const fd of food)if(fd.rest){const d=Math.abs(fd.x-f.x)+Math.abs(fd.y-f.y);if(d<bd){bd=d;tg=fd}}
   if(tg){f.tx=tg.x;f.ty=tg.y}
   const d=f.tx-f.x,e=cl(f.ty,GY+5,H-6)-f.y,v=(f.sp=='crab'?9:3)*(tg?2:1);
   if(Math.abs(d)>1){f.dir=d>0?1:-1;f.x+=f.dir*dt*v}if(Math.abs(e)>1)f.y+=Math.sign(e)*dt*v*.6;
   if(tg&&Math.abs(tg.x-f.x)<s.w+1&&Math.abs(tg.y-f.y)<4){food.splice(food.indexOf(tg),1);f.full=Math.min(100,f.full+32);spark(tg.x,tg.y,3,'#ffd9a8');snd(300,.05,'sine',.03)}}
  else{let tg=null,bd=1e9;if(f.full<70)for(const fd of food)if(!fd.rest){const d=Math.hypot(fd.x-f.x,fd.y-f.y);if(d<bd){bd=d;tg=fd}}
   if(tg){f.tx=tg.x;f.ty=tg.y}else if(f.tt<=0){f.tx=R(12,W-12);f.ty=R(18,GY-10);f.tt=R(2.5,6);if(S.items.length&&Math.random()<.25){const it=pick(S.items);f.tx=cl(it.x+R(-8,8),12,W-12);f.ty=cl(it.y-IT[it.id].h-R(2,8),18,GY-10)}if(s.sc){const m=S.fish.find(o=>o!==f&&o.sp==f.sp);if(m){f.tx=cl(m.tx+R(-8,8),12,W-12);f.ty=cl(m.ty+R(-6,6),18,GY-10)}}}
   f.sl=!tg&&night>.3&&f.full>45;if(f.sl){f.tx=f.x;f.ty=f.y;f.tt=1;if(Math.random()<dt*.8)parts.push({x:f.x+f.dir*s.w,y:f.y-s.h-3,vx:3,vy:-6,l:1.8,k:'z'})}
   const dx=f.tx-f.x,dy=f.ty-f.y,d=Math.hypot(dx,dy)||1,v=(tg?22:11)*(s.sp||1);
   if(d>2){f.vx+=(dx/d*v-f.vx)*dt*2;f.vy+=(dy/d*v-f.vy)*dt*2}else{f.vx*=.92;f.vy*=.92}
   f.x=cl(f.x+f.vx*dt,6,W-6);f.y=cl(f.y+f.vy*dt,14,GY-6);if(Math.abs(f.vx)>1.5)f.dir=f.vx>0?1:-1;
   for(let i=food.length-1;i>=0;i--){const fd=food[i];if(f.full<95&&Math.abs(fd.x-(f.x+f.dir*s.w))<s.w&&Math.abs(fd.y-f.y)<s.h+3){food.splice(i,1);f.full=Math.min(100,f.full+32);spark(fd.x,fd.y,3,'#ffd9a8');snd(300+R(0,200),.05,'sine',.03)}}}
  f.mood=(f.full>25?.5:0)+(S.clean>35?.5:0);
  f.ct-=dt*(boost>0?3:1)*(f.mood>=1?1:f.mood>0?.35:0);
  if(f.ct<=0&&coins.length<24){coins.push({x:f.x,y:cl(f.y-4,14,GY),v:cval(s),age:0});f.ct=R(6,10)}}
 for(let i=food.length-1;i>=0;i--){const fd=food[i];fd.gy=fd.gy||R(GY+5,H-7);if(!fd.rest){fd.y+=fd.vy*dt;if(fd.y>=fd.gy){fd.y=fd.gy;fd.rest=1;fd.rt=0}}else{fd.rt+=dt;if(fd.rt>22){food.splice(i,1);S.clean=Math.max(0,S.clean-1.2)}}}
 for(let i=coins.length-1;i>=0;i--){const k=coins[i];k.age+=dt;if(S.auto&&k.age>.5){S.coins+=k.v;spark(k.x,k.y,6,'#ffe066');snd(880,.06,'square',.02);coins.splice(i,1)}else if(k.age>40)coins.splice(i,1)}
 if(Math.random()<dt*2&&bub.length<40){const p=S.items.length&&Math.random()<.6?pick(S.items):null;bub.push({x:p?p.x+R(-3,3):R(6,W-6),y:p?p.y-4:GY+R(2,20),r:Math.random()<.25?2:1,ph:R(0,6),v:R(10,20)})}
 for(let i=bub.length-1;i>=0;i--){bub[i].y-=bub[i].v*dt;if(bub[i].y<7)bub.splice(i,1)}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<=0)parts.splice(i,1)}
 if(AM){const A=S.atm;if(amb.length<40&&Math.random()<dt*(A=='sakura'?5:A=='star'?4:2.5))amb.push(A=='sakura'?{k:'pt',x:R(0,W),y:6,vx:R(-4,4),vy:R(5,10),ph:R(0,6),l:18}:{k:'p',x:R(0,W),y:R(10,GY),vx:R(-2,2),vy:R(-3,0),ph:R(0,6),l:R(6,12)});
  if(Math.random()<dt*.04)amb.push({k:'ss',x:R(40,W),y:R(6,30),l:.9});if(Math.random()<dt*.12&&amb.length<40)amb.push({k:'lf',x:R(0,W),y:7,vx:R(2,5),vy:0,ph:R(0,6),l:14});
  for(let i=amb.length-1;i>=0;i--){const p=amb[i];p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;if(p.k=='ss'){p.x-=70*dt;p.y+=35*dt}p.l-=dt;if(p.l<=0||p.y>GY+8)amb.splice(i,1)}}
}

 [[34,9],[96,14],[130,7]].forEach(([x,y])=>{rc(c,x,GY+y+5,3,2,'#b9a98a');rc(c,x,GY+y+5,2,1,'#d6c8a8')});
 [[22,6],[71,11],[118,4],[143,13]].forEach(([x,y],i)=>{rc(c,x,GY+8+y,2,2,'#FFF3DE');rc(c,x,GY+8+y,1,1,'#fff');if(Math.sin(t*AM*2+i*2)>.85)rc(c,x+2,GY+7+y,1,1,'#fff')});
 for(let x=0;x<W;x+=2)for(let y=GY+3;y<H;y+=2){const v=Math.sin(x*.21+t*AM*1.3)+Math.sin(y*.37-t*AM*1.1)+Math.sin((x+y)*.17+t*AM*.9);if(v>1.9)rc(c,x,y,2,1,'rgba(255,255,230,.24)')}
 const dr=[];S.items.forEach(i=>dr.push({y:i.y,f:()=>{itemDraw(c,i.id,i.x,i.y,t);if(IT[i.id].p>=75&&Math.sin(t*AM*2+i.x)>.9)rc(c,i.x+Math.round(Math.sin(i.x)*5),i.y-IT[i.id].h-2,1,1,'#fff')}}));
 S.fish.filter(f=>SP[f.sp].g).forEach(f=>dr.push({y:f.y,f:()=>fishDraw(c,SP[f.sp],f.x,f.y,f.dir,t)}));
 dr.sort((a,b)=>a.y-b.y).forEach(d=>d.f());
 for(const f of S.fish){const s=SP[f.sp];if(!s.g)fishDraw(c,s,f.x,f.y,f.dir,t);if(f.sl&&s.c){const ex=f.dir>0?f.x+s.w-3:f.x-s.w+1;rc(c,ex,f.y-1,2,1,s.c)}
  if(f.full<30){const by=f.y-s.h-(s.g?8:9);rc(c,f.x-3,by,7,6,'#fff');rc(c,f.x,by+1,1,3,'#ff5d73');rc(c,f.x,by+5,1,1,'#ff5d73');rc(c,f.x,by+6,1,1,'#fff')}}
 for(const fd of food){rc(c,fd.x+Math.sin(t*3+fd.ph),fd.y,2,2,'#ffb347')}
 for(const b of bub){c.globalAlpha=.4+.6*((b.ph*3)%1);const x=b.x+Math.sin(t*3+b.ph)*1.5;if(b.r>1){rc(c,x,b.y,3,1,'rgba(255,255,255,.7)');rc(c,x,b.y+2,3,1,'rgba(255,255,255,.7)');rc(c,x-1,b.y+1,1,1,'rgba(255,255,255,.7)');rc(c,x+3,b.y+1,1,1,'rgba(255,255,255,.7)')}else rc(c,x,b.y,2,2,'rgba(255,255,255,.55)')}c.globalAlpha=1;
 const bio=S.atm=='bio';if(S.uv||bio){rc(c,0,0,W,H,S.uv?'rgba(40,6,100,.62)':'rgba(0,25,60,.5)');c.globalCompositeOperation='lighter';
  S.items.forEach(i=>{if(IT[i.id].u||bio)itemDraw(c,i.id,i.x,i.y,t)});
  S.fish.forEach(f=>fishDraw(c,SP[f.sp],f.x,f.y,f.dir,t));
  for(let i=0;i<24;i++)if(Math.sin(t*2+i*5)>.3)rc(c,(i*47+t*3)%W,10+(i*31)%110,1,1,i%2?'#b36bff':'#5ef2ff');
  c.globalCompositeOperation='source-over'}
 const TN={moon:'rgba(50,40,130,.18)',dream:'rgba(235,170,255,.2)',gold:'rgba(255,190,90,.16)',sakura:'rgba(255,170,200,.1)'}[S.atm];if(TN)rc(c,0,0,W,H,TN);if(night>.02)rc(c,0,0,W,H,'rgba(30,30,100,'+night*.5+')');
 for(const p of amb){const x=Math.round(p.x+Math.sin(t+p.ph)*2),y=Math.round(p.y);

 if(gift){const x=gift.x,y=gift.y;rc(c,x-3,y-5,7,1,'rgba(255,255,255,.8)');rc(c,x-4,y-4,9,7,'rgba(255,255,255,.35)');rc(c,x-3,y+3,7,1,'rgba(255,255,255,.8)');rc(c,x-1,y-2,3,3,'#ffd34d');rc(c,x-2,y-1,5,1,'#ffd34d');rc(c,x-3,y-4,2,1,'#fff');rc(c,x+3+Math.round(Math.sin(t*6)),y-7,1,1,'#fff')}
 for(const k of coins){const y=k.y+Math.sin(t*3+k.x)*1.5,x=k.x;if(k.age>32&&Math.floor(t*6)%2)continue;
  rc(c,x-1,y-3,3,1,'#ffd34d');rc(c,x-2,y-2,5,4,'#ffd34d');rc(c,x-1,y+2,3,1,'#e0a521');rc(c,x+1,y,2,2,'#e0a521');rc(c,x-1,y-2,1,2,'#fff4b0');rc(c,x-3,y-5+Math.round(Math.sin(t*5+x)),1,1,'#fff')}
 for(const p of parts){const a=Math.min(1,p.l*2);c.globalAlpha=a;if(p.k=='h'){const x=Math.round(p.x),y=Math.round(p.y),h='#ff6b9a';rc(c,x-2,y,2,1,h);rc(c,x+1,y,2,1,h);rc(c,x-2,y+1,5,1,h);rc(c,x-1,y+2,3,1,h);rc(c,x,y+3,1,1,h)}else if(p.k=='z'){const x=Math.round(p.x),y=Math.round(p.y);rc(c,x,y,3,1,'#fff');rc(c,x+1,y+1,1,1,'#fff');rc(c,x,y+2,3,1,'#fff')}else rc(c,p.x,p.y,1,1,p.col);c.globalAlpha=1}
 if(place&&ptr)itemDraw(c,place,cl(ptr.x,8,W-8),cl(ptr.y,GY+4,H-4),t,.6);
 rc(c,0,0,W,5,'rgba(255,255,255,.22)');for(let x=0;x<W;x+=5)rc(c,x,5+Math.round(Math.sin(t*2+x*.3)),3,1,'rgba(255,255,255,.5)');
 const dirt=(100-S.clean)/100;if(dirt>.05)rc(c,0,0,W,H,'rgba(110,140,50,'+dirt*.4+')');
 
 
}

 if(hudT<=0){hudT=.25;$('co').textContent=S.coins;$('bB').lastChild.textContent=boost>0?Math.ceil(boost)+'s':bcd>0?Math.ceil(bcd)+'s':'Boost';$('bB').classList.toggle('on',boost>0);$('wa').textContent=Math.round(S.clean);$('fc').textContent=S.fish.length;
