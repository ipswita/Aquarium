<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cozy Reef</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe9d6;--bg2:#ffc4c9;--panel:#fff8ef;--ink:#5b3b3b;--acc:#ff7fa8;--wood:#c98f5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b2440;--bg2:#4a3260;--panel:#3a3150;--ink:#ffe9f0;--wood:#8a5a3a}}
:root[data-theme="dark"]{--bg1:#2b2440;--bg2:#4a3260;--panel:#3a3150;--ink:#ffe9f0;--wood:#8a5a3a}
html,body{height:100%;margin:0}
body{font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:linear-gradient(var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#hud,#bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--panel);border-radius:99px;padding:5px 12px;font-weight:700;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
#tank{position:relative;width:min(94vw,calc((100dvh - 215px)*1.25));aspect-ratio:5/4;border:6px solid rgba(255,255,255,.8);border-radius:20px;box-shadow:0 10px 0 var(--wood),0 20px 26px rgba(0,0,0,.25);overflow:hidden;background:#1c8fb0}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block;touch-action:none}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.93);color:#5b3b3b;padding:5px 13px;border-radius:99px;font-weight:700;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#ban{position:absolute;bottom:8px;left:8px;right:8px;display:none;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.93);color:#5b3b3b;border-radius:14px;padding:6px 10px;font-weight:700;font-size:13px}
#ban button{font:inherit;font-weight:700;background:#ff7fa8;color:#fff;border:0;border-radius:10px;padding:5px 14px;cursor:pointer}
.btn{font:inherit;font-weight:700;font-size:13px;background:var(--panel);color:var(--ink);border:0;border-radius:16px;padding:7px 13px;box-shadow:0 4px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:58px}
.btn span{font-size:21px;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.on{background:var(--acc);color:#fff}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#shop{position:fixed;left:0;right:0;bottom:0;max-height:58%;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .3s;z-index:5;box-sizing:border-box}
#shop.open{transform:none}
#tabs{display:flex;gap:6px;margin-bottom:10px;overflow:auto}
.tab{font:inherit;font-weight:700;font-size:13px;border:0;border-radius:99px;padding:6px 13px;background:rgba(255,127,168,.18);color:var(--ink);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--acc);color:#fff}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.card{background:rgba(255,127,168,.14);border:2px solid transparent;border-radius:14px;padding:6px 4px;text-align:center;font-size:12px;font-weight:500;cursor:pointer}
.card canvas{width:52px;height:52px;border-radius:10px}
.card b{display:block;font-size:13px}
.card.no{opacity:.45}.card.on{border-color:var(--acc)}
@media(prefers-reduced-motion:reduce){#shop,#toast{transition:none}}
</style></head>
<body>
<div id="hud"><span class="chip">🪙 <b id="co">0</b></span><span class="chip">💧 <b id="wa">100</b>%</span><span class="chip">🐠 <b id="fc">0</b>/12</span><span class="chip" id="md">😊</span></div>
<div id="tank"><canvas id="c" aria-label="Aquarium"></canvas><div id="toast"></div><div id="ban"><span id="bt"></span><button id="done">Done</button></div></div>
<div id="bar">
<button class="btn" id="bF"><span>🍤</span>Feed</button>
<button class="btn" id="bC"><span>🫧</span>Clean</button>
<button class="btn" id="bS"><span>🛒</span>Shop</button>
<button class="btn" id="bT"><span>🧹</span>Tidy</button>
<button class="btn" id="bM"><span>🔊</span>Sound</button>
</div>
<div id="shop"><div id="tabs"></div><div id="grid"></div></div>
<script>
const W=160,H=128,GY=98,$=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d');cv.width=W;cv.height=H;
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const rc=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h)};
const NAMES=['Bubbles','Mochi','Pearl','Sunny','Pebble','Coco','Bean','Waffle','Luna','Pip','Daisy','Miso','Biscuit','Tango','Kiwi','Peach'];
const SP={
guppy:{n:'Guppy',p:25,w:5,h:3,c:'#ff9f5a',d:'#ffd9a8',t:'#ff6b9a',pat:3},
tetra:{n:'Neon Tetra',p:40,w:5,h:2,c:'#4a8bff',d:'#e8f4ff',t:'#ff5d73',pat:2,sp:1.25},
gold:{n:'Goldfish',p:70,w:7,h:4,c:'#ffa63d',d:'#ffd27a',t:'#ff7a3d',pat:0},
clown:{n:'Clownfish',p:110,w:6,h:4,c:'#ff7b2e',d:'#ff9a52',t:'#ff7b2e',pat:1},
angel:{n:'Angelfish',p:160,w:5,h:6,c:'#e9edf5',d:'#ffffff',t:'#c9d3e8',pat:4,sp:.8},
puffer:{n:'Pufferfish',p:240,w:6,h:5,c:'#ffd84d',d:'#fff3b8',t:'#ffb347',pat:3,sp:.7},
snail:{n:'Snail',p:45,g:1,w:4,h:4},
crab:{n:'Crab',p:90,g:1,w:6,h:5}};
const IT={
grass:{n:'Seagrass',p:12,t:'p',h:13},vall:{n:'Vallisneria',p:18,t:'p',h:22},kelp:{n:'Kelp',p:25,t:'p',h:30},coral:{n:'Pink Coral',p:35,t:'p',h:11},moss:{n:'Moss Ball',p:15,t:'p',h:6},
rock:{n:'Pebble Rock',p:20,t:'d',h:8},wood:{n:'Driftwood',p:50,t:'d',h:12},chest:{n:'Treasure Chest',p:75,t:'d',h:9},castle:{n:'Sand Castle',p:90,t:'d',h:20,hw:10},shell:{n:'Seashell',p:15,t:'d',h:6}};
const GR={sand:{n:'Golden Sand',p:0,b:'#f1d49c',t:'#fbe8be',l:2,d:'#dfbd80'},pink:{n:'Pink Sand',p:30,b:'#f2b8cb',t:'#ffd9e5',l:2,d:'#e598b2'},meadow:{n:'Moss Meadow',p:60,b:'#7a5240',t:'#68d070',l:3,d:'#5a3b2d'}};
const TH={lagoon:{n:'Lagoon',p:0,a:[127,224,224],b:[28,143,176]},deep:{n:'Deep Blue',p:50,a:[90,170,240],b:[19,48,110]},sunset:{n:'Sunset Pool',p:50,a:[255,205,170],b:[190,100,170]}};

function fishDraw(c,s,x,y,dir,t){
 if(s.g)return crit(c,s,x,y,dir,t);
 const w=s.w,h=s.h,wg=Math.round(Math.sin(t*9));
 for(let i=0;i<4;i++)rc(c,dir>0?x-w-i-1:x+w+i,y-i+(i>1?wg:0),1,1+2*i,s.t);
 rc(c,x-1,y-h-1,3,1,s.t);
 if(s.pat==4){rc(c,x-1,y-h-4,1,3,s.t);rc(c,x-1,y+h+1,1,3,s.t)}
 for(let dy=-h;dy<=h;dy++){
  const hw=Math.round(w*Math.sqrt(Math.max(0,1-dy*dy/((h+.6)*(h+.6)))));
  rc(c,x-hw,y+dy,hw*2,1,dy>h*.3?s.d:s.c);
  if(s.pat==1&&hw>=4){rc(c,x+dir*2,y+dy,1,1,'#fff');rc(c,x-dir*3,y+dy,1,1,'#fff')}
  if(s.pat==2&&dy==0)rc(c,x-hw+1,y,hw*2-2,1,'#3df0ff');
  if(s.pat==3&&(dy==-1||dy==2)&&hw>2)rc(c,x-dy,y+dy,1,1,'rgba(255,255,255,.75)');
  if(s.pat==4&&hw>=2){rc(c,x-1,y+dy,1,1,'#44446a');rc(c,x+2,y+dy,1,1,'#44446a')}
 }
 const ex=dir>0?x+w-3:x-w+1;
 rc(c,ex,y-1,2,2,'#2b1b2b');rc(c,dir>0?ex+1:ex,y-1,1,1,'#fff');
 rc(c,dir>0?x+w-6:x-w+4,y+1,2,1,'rgba(255,110,160,.85)');
}
function crit(c,s,x,y,dir,t){
 if(s===SP.snail){
  rc(c,x-4,y-1,8,2,'#f0d2a8');const hx=dir>0?x+3:x-4;rc(c,hx,y-3,1,2,'#f0d2a8');rc(c,hx,y-4,1,1,'#2b1b2b');
  rc(c,x-3,y-5,5,5,'#ff9ec0');rc(c,x-2,y-4,3,3,'#ffc2d8');rc(c,x-1,y-3,1,1,'#ff7ba6');
 }else{
  [-3,-1,1,3].forEach(i=>rc(c,x+i,y-1,1,1+(Math.sin(t*8+i)>0?1:0),'#d9483b'));
  rc(c,x-4,y-4,8,3,'#ff6b5e');rc(c,x-3,y-5,6,1,'#ff8a7a');
  rc(c,x-2,y-7,1,2,'#fff');rc(c,x+1,y-7,1,2,'#fff');rc(c,x-2,y-7,1,1,'#2b1b2b');rc(c,x+1,y-7,1,1,'#2b1b2b');
  rc(c,x-6,y-6,2,3,'#ff6b5e');rc(c,x+4,y-6,2,3,'#ff6b5e');
 }
}
function itemDraw(c,id,x,y,t,a=1){
 c.globalAlpha=a;const sn=Math.sin;
 const bl=(bx,n,col,ph)=>{for(let i=0;i<n;i++)rc(c,bx+sn(t*1.6+ph+i*.22)*i/n*2.5,y-i,1,1,col)};
 if(id=='grass')[-3,-1,1,3].forEach((o,k)=>bl(x+o,9+k%2*4,k%2?'#79d66f':'#4cb86a',k));
 else if(id=='vall')[-2,0,2].forEach((o,k)=>{bl(x+o,18+k*2,'#7ddc6a',k);bl(x+o+1,18+k*2,'#4fb85a',k)});
 else if(id=='kelp')for(let i=0;i<30;i++){const o=sn(t+i*.2)*i/30*3;rc(c,x+o,y-i,2,1,'#3fa76a');if(i%6==3)rc(c,x+o+2,y-i,3,2,'#58c98a');if(i%6==0)rc(c,x+o-3,y-i,3,2,'#58c98a')}
 else if(id=='coral'){const p='#ff7fa8',q='#ffb3cc';rc(c,x-1,y-6,3,6,p);rc(c,x-4,y-9,2,6,p);rc(c,x+3,y-8,2,5,p);rc(c,x-3,y-5,3,2,p);rc(c,x+1,y-6,3,2,p);rc(c,x-1,y-8,3,3,q);rc(c,x-4,y-10,2,2,q);rc(c,x+3,y-9,2,2,q)}
 else if(id=='moss'){rc(c,x-2,y-6,4,1,'#5fc26a');rc(c,x-4,y-5,8,1,'#5fc26a');rc(c,x-5,y-4,10,3,'#5fc26a');rc(c,x-4,y-1,8,1,'#4aa65a');rc(c,x-2,y-5,2,1,'#8ee08a');rc(c,x+1,y-3,1,1,'#8ee08a')}
 else if(id=='rock'){rc(c,x-6,y-4,12,5,'#8f8aa0');rc(c,x-4,y-7,8,4,'#a9a4bb');rc(c,x-3,y-6,3,1,'#d3cfe4');rc(c,x-6,y,12,1,'#6f6a82');rc(c,x+2,y-3,3,2,'#76cf80')}
 else if(id=='wood'){for(let i=0;i<14;i++){rc(c,x-8+i,y-2-Math.round(i*.6),3,3,'#9b6b43');rc(c,x-8+i,y-2-Math.round(i*.6),3,1,'#b98558')}rc(c,x+2,y-12,2,5,'#9b6b43');rc(c,x-6,y-1,5,2,'#7d5233')}
 else if(id=='chest'){rc(c,x-6,y-5,12,5,'#b9783f');rc(c,x-6,y-9,12,4,'#cf8d4d');rc(c,x-6,y-9,12,1,'#e3a864');rc(c,x-6,y-6,12,1,'#ffd34d');rc(c,x-1,y-6,2,3,'#ffd34d');rc(c,x-5,y-10,3,1,'#ffd34d')}
 else if(id=='castle'){rc(c,x-9,y-10,18,10,'#f1d3a0');rc(c,x-10,y-17,6,17,'#e6c18a');rc(c,x+4,y-17,6,17,'#e6c18a');[-10,-7,4,8].forEach(o=>rc(c,x+o,y-19,2,2,'#e6c18a'));rc(c,x-2,y-6,4,6,'#7a5a7e');rc(c,x-8,y-13,2,3,'#6b5a8a');rc(c,x+6,y-13,2,3,'#6b5a8a');rc(c,x-1,y-20,1,3,'#8a6a4a');rc(c,x,y-20,3,2,'#ff7fa8')}
 else if(id=='shell'){rc(c,x-3,y-2,6,2,'#ffc2d8');rc(c,x-4,y-4,8,2,'#ffb0cb');rc(c,x-2,y-6,4,2,'#ffd6e4');rc(c,x-1,y-6,1,6,'#ff9ec0')}
 c.globalAlpha=1;
}
const dflt=()=>({coins:60,fish:[],items:[{id:'grass',x:36,y:112},{id:'grass',x:46,y:114},{id:'rock',x:118,y:112}],ground:'sand',theme:'lagoon',own:['sand','lagoon'],clean:100,mute:0,t:0,init:0});
let S=dflt();try{Object.assign(S,JSON.parse(localStorage.getItem('cozyreef1')||'{}'))}catch(e){}
const mk=sp=>{const s=SP[sp];return{sp,name:pick(NAMES),x:R(20,W-20),y:s.g?R(GY+6,H-6):R(22,70),vx:0,vy:0,tx:80,ty:50,tt:0,full:70,ct:R(4,9),dir:1,mood:1}};
if(!S.init){S.init=1;S.fish.push(mk('guppy'),mk('guppy'))}
const save=()=>{try{localStorage.setItem('cozyreef1',JSON.stringify(S))}catch(e){}};
setInterval(save,4000);document.addEventListener('visibilitychange',save);
let food=[],coins=[],bub=[],parts=[],place=null,tidy=false,ptr=null,tab='fish',grad=[],tt,ac;
function setGrad(){const T=TH[S.theme];grad=[...Array(H)].map((_,y)=>{const k=y/H;return'rgb('+T.a.map((v,i)=>Math.round(v+(T.b[i]-v)*k)).join(',')+')'})}setGrad();
function snd(f,d=.09,ty='sine',v=.05){if(S.mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),gn=ac.createGain();o.type=ty;o.frequency.value=f;gn.gain.setValueAtTime(v,ac.currentTime);gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(gn);gn.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2400)}
function spark(x,y,n,col){for(let i=0;i<n;i++)parts.push({x,y,vx:R(-18,18),vy:R(-22,-4),l:R(.5,1),k:'s',col})}
function banner(){const b=$('ban');b.style.display=place||tidy?'flex':'none';$('bt').textContent=place?'Tap the sand to place '+IT[place].n+' ('+IT[place].p+' 🪙)':'Tidy mode: tap decor to sell it for half';$('bT').classList.toggle('on',tidy)}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointermove',e=>{ptr=pos(e)});
cv.addEventListener('pointerdown',e=>{ptr=pos(e);tap(ptr.x,ptr.y)});
function tap(x,y){
 if($('shop').classList.contains('open')){$('shop').classList.remove('open');return}
 if(place){const it=IT[place];if(S.coins<it.p){toast('Not enough coins yet');place=null;banner();return}
  if(S.items.length>=40){toast('The tank is full of decor!');return}
  S.coins-=it.p;S.items.push({id:place,x:cl(x,8,W-8),y:cl(y,GY+4,H-4)});snd(520,.1,'triangle');spark(x,y-4,6,'#fff6a8');
  if(S.coins<it.p){place=null;banner()}return}
 if(tidy){let b=null,bd=99;S.items.forEach(i=>{const dx=Math.abs(i.x-x),hw=IT[i.id].hw||7;if(dx<hw&&y>i.y-IT[i.id].h-3&&y<i.y+4&&dx<bd){bd=dx;b=i}});
  if(b){S.items.splice(S.items.indexOf(b),1);const r=Math.floor(IT[b.id].p/2);S.coins+=r;snd(330,.12);spark(b.x,b.y-5,8,'#fff');toast('Sold for '+r+' 🪙')}return}
 for(const c of coins)if(Math.abs(c.x-x)<10&&Math.abs(c.y-y)<10){coins.splice(coins.indexOf(c),1);S.coins+=c.v;snd(880,.08,'square',.03);setTimeout(()=>snd(1320,.12,'square',.03),70);spark(c.x,c.y,8,'#ffe066');return}
 for(const f of S.fish){const s=SP[f.sp];if(Math.abs(f.x-x)<s.w+4&&Math.abs(f.y-y)<s.h+5){f.ct=Math.max(0,f.ct-1.5);parts.push({x:f.x,y:f.y-s.h-6,vx:0,vy:-12,l:1.2,k:'h'});snd(700,.1,'triangle');
  toast(f.name+' the '+s.n+' · '+(f.full>60?'happy & full':f.full>25?'a little peckish':'hungry!'));return}}
 if(food.length<18){for(let i=0;i<2;i++)food.push({x:cl(x+R(-3,3),4,W-4),y:8+i*3,vy:R(7,11),ph:R(0,6)});snd(500,.05,'sine',.03)}
}
$('bF').onclick=()=>{if(food.length<18){for(let i=0;i<6;i++)food.push({x:R(14,W-14),y:R(6,12),vy:R(7,11),ph:R(0,6)});snd(520,.07)}};
$('bC').onclick=()=>{S.clean=100;for(let i=0;i<50;i++)bub.push({x:R(4,W-4),y:H-R(0,20),r:Math.random()<.3?2:1,ph:R(0,6),v:R(25,50)});toast('Sparkling clean! ✨');snd(600,.25,'triangle')};
$('bS').onclick=()=>{place=null;tidy=false;banner();$('shop').classList.toggle('open');grid()};
$('bT').onclick=()=>{tidy=!tidy;place=null;banner();$('shop').classList.remove('open')};
$('bM').onclick=()=>{S.mute=S.mute?0:1;$('bM').firstChild.textContent=S.mute?'🔇':'🔊'};
$('done').onclick=()=>{place=null;tidy=false;banner()};
$('bM').firstChild.textContent=S.mute?'🔇':'🔊';
function grid(){
 $('tabs').innerHTML='';[['fish','🐠 Critters'],['plants','🌿 Plants'],['decor','🪨 Decor'],['style','🎨 Style']].forEach(([k,l])=>{const b=document.createElement('button');b.className='tab'+(tab==k?' on':'');b.textContent=l;b.onclick=()=>{tab=k;grid()};$('tabs').append(b)});
 const gr=$('grid');gr.innerHTML='';
 const add=(label,sub,on,no,draw,fn)=>{const d=document.createElement('div');d.className='card'+(on?' on':'')+(no?' no':'');const k=document.createElement('canvas');k.width=k.height=34;draw(k.getContext('2d'));d.append(k);d.insertAdjacentHTML('beforeend','<b>'+label+'</b>'+sub);d.onclick=fn;gr.append(d)};
 if(tab=='fish')Object.keys(SP).forEach(id=>{const s=SP[id];add(s.n,s.p+' 🪙',0,S.coins<s.p,c=>fishDraw(c,s,17,s.g?27:17,1,0),()=>{
  if(S.fish.length>=12)return toast('The tank is full (12 friends max)');
  if(S.coins<s.p)return toast('Not enough coins yet');
  S.coins-=s.p;const f=mk(id);S.fish.push(f);snd(660,.15,'triangle');toast('Welcome, '+f.name+'! 💖');$('shop').classList.remove('open')})});
 else if(tab=='style'){
  Object.keys(GR).forEach(id=>{const s=GR[id],o=S.own.includes(id);add(s.n,S.ground==id?'Equipped':o?'Use':s.p+' 🪙',S.ground==id,!o&&S.coins<s.p,c=>{rc(c,0,0,34,34,s.t);rc(c,0,s.l*2,34,34,s.b);rc(c,6,20,2,2,s.d);rc(c,22,26,2,2,s.d)},()=>{if(!o){if(S.coins<s.p)return toast('Not enough coins yet');S.coins-=s.p;S.own.push(id)}S.ground=id;snd(560,.1);grid()})});
  Object.keys(TH).forEach(id=>{const s=TH[id],o=S.own.includes(id);add(s.n,S.theme==id?'Equipped':o?'Use':s.p+' 🪙',S.theme==id,!o&&S.coins<s.p,c=>{for(let y=0;y<34;y++)rc(c,0,y,34,1,'rgb('+s.a.map((v,i)=>Math.round(v+(s.b[i]-v)*y/34)).join(',')+')')},()=>{if(!o){if(S.coins<s.p)return toast('Not enough coins yet');S.coins-=s.p;S.own.push(id)}S.theme=id;setGrad();snd(560,.1);grid()})})}
 else Object.keys(IT).filter(id=>IT[id].t==(tab=='plants'?'p':'d')).forEach(id=>{const s=IT[id];add(s.n,s.p+' 🪙',0,S.coins<s.p,c=>itemDraw(c,id,17,31,0),()=>{
  if(S.coins<s.p)return toast('Not enough coins yet');place=id;banner();$('shop').classList.remove('open')})});
}
function update(dt){
 S.t+=dt;
 const nf=S.fish.length,sn=S.fish.filter(f=>f.sp=='snail').length,pl=S.items.filter(i=>IT[i.id].t=='p').length;
 S.clean=cl(S.clean-dt*Math.max(.008,.025+.03*nf-.01*Math.min(pl,6)-.025*sn),0,100);
 for(const f of S.fish){const s=SP[f.sp];f.full=Math.max(0,f.full-dt*.9);f.tt-=dt;
  if(s.g){if(f.tt<=0){f.tx=R(10,W-10);f.tt=R(3,8)}const d=f.tx-f.x;if(Math.abs(d)>1){f.dir=d>0?1:-1;f.x+=f.dir*dt*(f.sp=='crab'?9:3)}}
  else{let tg=null,bd=1e9;if(f.full<70)for(const fd of food){const d=Math.hypot(fd.x-f.x,fd.y-f.y);if(d<bd){bd=d;tg=fd}}
   if(tg){f.tx=tg.x;f.ty=tg.y}else if(f.tt<=0){f.tx=R(12,W-12);f.ty=R(18,GY-10);f.tt=R(2.5,6)}
   const dx=f.tx-f.x,dy=f.ty-f.y,d=Math.hypot(dx,dy)||1,v=(tg?22:11)*(s.sp||1);
   if(d>2){f.vx+=(dx/d*v-f.vx)*dt*2;f.vy+=(dy/d*v-f.vy)*dt*2}else{f.vx*=.92;f.vy*=.92}
   f.x=cl(f.x+f.vx*dt,6,W-6);f.y=cl(f.y+f.vy*dt,14,GY-6);if(Math.abs(f.vx)>1.5)f.dir=f.vx>0?1:-1;
   for(let i=food.length-1;i>=0;i--){const fd=food[i];if(f.full<95&&Math.abs(fd.x-(f.x+f.dir*s.w))<s.w&&Math.abs(fd.y-f.y)<s.h+3){food.splice(i,1);f.full=Math.min(100,f.full+32);spark(fd.x,fd.y,3,'#ffd9a8');snd(300+R(0,200),.05,'sine',.03)}}}
  f.mood=(f.full>25?.5:0)+(S.clean>35?.5:0);
  f.ct-=dt*(f.mood>=1?1:f.mood>0?.35:0);
  if(f.ct<=0&&coins.length<14){coins.push({x:f.x,y:cl(f.y-4,14,GY),v:Math.max(1,Math.round(s.p/30)),age:0});f.ct=R(9,15)}}
 for(let i=food.length-1;i>=0;i--){const fd=food[i];fd.y+=fd.vy*dt;if(fd.y>=GY){food.splice(i,1);S.clean=Math.max(0,S.clean-1.2)}}
 for(let i=coins.length-1;i>=0;i--){coins[i].age+=dt;if(coins[i].age>40)coins.splice(i,1)}
 if(Math.random()<dt*2&&bub.length<40){const p=S.items.length&&Math.random()<.6?pick(S.items):null;bub.push({x:p?p.x+R(-3,3):R(6,W-6),y:p?p.y-4:GY+R(2,20),r:Math.random()<.25?2:1,ph:R(0,6),v:R(10,20)})}
 for(let i=bub.length-1;i>=0;i--){bub[i].y-=bub[i].v*dt;if(bub[i].y<7)bub.splice(i,1)}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<=0)parts.splice(i,1)}
}
function render(){
 const c=g,t=S.t;
 for(let y=0;y<H;y++)rc(c,0,y,W,1,grad[y]);
 for(let i=0;i<3;i++)for(let y=6;y<GY;y++)rc(c,i*58+10+Math.sin(t*.3+i)*12+y*.4,y,5+i,1,'rgba(255,255,255,.07)');
 const G=GR[S.ground];
 for(let x=0;x<W;x++){const top=GY+Math.round(Math.sin(x*.09)*1.5+Math.sin(x*.23)*.8);rc(c,x,top,1,H-top,G.b);rc(c,x,top,1,G.l,G.t)}
 for(let i=0;i<60;i++)rc(c,(i*37)%W,GY+4+(i*17)%(H-GY-5),1,1,G.d);
 const dr=[];S.items.forEach(i=>dr.push({y:i.y,f:()=>itemDraw(c,i.id,i.x,i.y,t)}));
 S.fish.filter(f=>SP[f.sp].g).forEach(f=>dr.push({y:f.y,f:()=>fishDraw(c,SP[f.sp],f.x,f.y,f.dir,t)}));
 dr.sort((a,b)=>a.y-b.y).forEach(d=>d.f());
 for(const f of S.fish){const s=SP[f.sp];if(!s.g)fishDraw(c,s,f.x,f.y,f.dir,t);
  if(f.full<30){const by=f.y-s.h-(s.g?8:9);rc(c,f.x-3,by,7,6,'#fff');rc(c,f.x,by+1,1,3,'#ff5d73');rc(c,f.x,by+5,1,1,'#ff5d73');rc(c,f.x,by+6,1,1,'#fff')}}
 for(const fd of food){rc(c,fd.x+Math.sin(t*3+fd.ph),fd.y,2,2,'#ffb347')}
 for(const b of bub){const x=b.x+Math.sin(t*3+b.ph)*1.5;if(b.r>1){rc(c,x,b.y,3,1,'rgba(255,255,255,.7)');rc(c,x,b.y+2,3,1,'rgba(255,255,255,.7)');rc(c,x-1,b.y+1,1,1,'rgba(255,255,255,.7)');rc(c,x+3,b.y+1,1,1,'rgba(255,255,255,.7)')}else rc(c,x,b.y,2,2,'rgba(255,255,255,.55)')}
 for(const k of coins){const y=k.y+Math.sin(t*3+k.x)*1.5,x=k.x;if(k.age>32&&Math.floor(t*6)%2)continue;
  rc(c,x-1,y-3,3,1,'#ffd34d');rc(c,x-2,y-2,5,4,'#ffd34d');rc(c,x-1,y+2,3,1,'#e0a521');rc(c,x+1,y,2,2,'#e0a521');rc(c,x-1,y-2,1,2,'#fff4b0');rc(c,x-3,y-5+Math.round(Math.sin(t*5+x)),1,1,'#fff')}
 for(const p of parts){const a=Math.min(1,p.l*2);c.globalAlpha=a;if(p.k=='h'){const x=Math.round(p.x),y=Math.round(p.y),h='#ff6b9a';rc(c,x-2,y,2,1,h);rc(c,x+1,y,2,1,h);rc(c,x-2,y+1,5,1,h);rc(c,x-1,y+2,3,1,h);rc(c,x,y+3,1,1,h)}else rc(c,p.x,p.y,1,1,p.col);c.globalAlpha=1}
 if(place&&ptr)itemDraw(c,place,cl(ptr.x,8,W-8),cl(ptr.y,GY+4,H-4),t,.6);
 rc(c,0,0,W,5,'rgba(255,255,255,.22)');for(let x=0;x<W;x+=5)rc(c,x,5+Math.round(Math.sin(t*2+x*.3)),3,1,'rgba(255,255,255,.5)');
 const dirt=(100-S.clean)/100;if(dirt>.05)rc(c,0,0,W,H,'rgba(110,140,50,'+dirt*.4+')');
 const dk=Math.max(0,-Math.sin(t/120*Math.PI*2))*.4;
 if(dk>.02){rc(c,0,0,W,H,'rgba(15,25,90,'+dk+')');for(let i=0;i<16;i++)if(Math.sin(t*2+i*3)>0)rc(c,(i*53)%W,12+(i*29)%80,1,1,'rgba(200,235,255,'+Math.min(1,dk*2.2)+')')}
}
let last=0,hudT=0;
function loop(n){const dt=Math.min(.05,(n-last)/1000||0);last=n;update(dt);render();hudT-=dt;
 if(hudT<=0){hudT=.25;$('co').textContent=S.coins;$('wa').textContent=Math.round(S.clean);$('fc').textContent=S.fish.length;
  const m=S.fish.length?S.fish.reduce((a,f)=>a+f.mood,0)/S.fish.length:1;$('md').textContent=m>.8?'😊':m>.4?'😐':'😢'}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
toast('Tap the water to feed · tap coins to collect!');
</script>
