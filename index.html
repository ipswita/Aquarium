<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Pixel Reef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4f1de;--mute:#9fb3c8;--panel:#16213e;--panel2:#1f2f57;--edge:#0a0f1f;--hi:#3d5a99;--gold:#ffd166;--coral:#ef476f;--mint:#06d6a0;--sky:#4cc9f0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 0%,#14234a,#070b16 70%);color:var(--ink);font-family:'Pixelify Sans',monospace;font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@supports (height:100dvh){html,body{height:100dvh}}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.px{background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--hi),0 4px 0 var(--edge);border-radius:4px}
#hud{display:flex;gap:8px;justify-content:center;width:100%;max-width:1200px}
.chip{display:flex;align-items:center;gap:6px;padding:3px 10px;font-size:16px;font-weight:600;min-height:40px}
.chip .ico{font-size:18px}
.stat{display:flex;flex-direction:column;gap:3px;line-height:1}
.stat small{font-size:11px;color:var(--mute);font-weight:400}
#coins{color:var(--gold)}
#rate{color:var(--mint)}
.meter{width:70px;height:8px;background:#0a0f1f;border:1px solid #000;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--mint);transition:width .3s,background .3s}
#lvl{color:var(--gold)}
#goal{display:flex;align-items:center;gap:8px;padding:3px 6px 3px 10px;font-size:14px;min-height:36px;max-width:min(100%,640px);cursor:default}
#goal .gtxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal .meter{width:56px;flex:none}
#goal b{color:var(--gold);white-space:nowrap}
#goal .btn{display:none}
#goal.done{box-shadow:inset 0 0 0 2px var(--mint),0 4px 0 var(--edge);cursor:pointer;animation:glow 1s ease-in-out infinite alternate}
#goal.done .btn{display:flex}
@keyframes glow{to{filter:brightness(1.25)}}
#tankwrap{position:relative;padding:10px;background:linear-gradient(#3b2a1e,#24170e);border:3px solid var(--edge);box-shadow:inset 0 0 0 3px #5c4330,0 8px 0 var(--edge),0 24px 70px rgba(0,0,0,.65);border-radius:6px}
#tankwrap.bump{animation:bump .25s}
@keyframes bump{30%{transform:translateY(3px) scale(1.004)}}
canvas#c{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:none}
#tools{position:absolute;top:16px;right:16px;display:flex;gap:6px;z-index:5}
.ibtn{width:38px;height:38px;font-size:18px;display:flex;align-items:center;justify-content:center;background:rgba(22,33,62,.75);border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--hi);border-radius:4px;cursor:pointer;color:var(--ink);padding:0}
#bar{display:flex;gap:8px;justify-content:center}
.btn{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--panel2);border:3px solid var(--edge);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),inset 0 0 0 2px var(--hi);border-radius:4px;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:72px;min-height:54px}
.btn .ic{font-size:22px;line-height:1}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--hi)}
.btn.on{background:#2d6a4f;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),inset 0 0 0 2px var(--mint)}
.btn.sm{flex-direction:row;min-width:0;min-height:36px;padding:4px 12px;font-size:13px}
.btn:focus-visible,.card:focus-visible,.tab:focus-visible,.ibtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#toasts{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:7;width:max-content;max-width:calc(100% - 110px)}
.toast{padding:6px 14px;font-size:15px;text-align:center;animation:tin .25s ease-out,tout .4s ease-in 2.6s forwards}
.toast.gold{background:#5c4a12;box-shadow:inset 0 0 0 2px var(--gold),0 4px 0 var(--edge)}
.toast.pink{background:#5a1f3d;box-shadow:inset 0 0 0 2px #ff8fc8,0 4px 0 var(--edge)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
#banner{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:6px 8px 6px 12px;display:none;gap:8px;align-items:center;font-size:14px;z-index:5;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(5,8,18,.72);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.open{display:flex}
.sheet{width:min(880px,100%);max-height:86vh;display:flex;flex-direction:column;padding:14px}
.sheet h2{margin:0 0 10px;font-size:22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h2 small{font-size:14px;color:var(--mute);font-weight:400;margin-right:auto}
.x{font:inherit;background:none;border:0;color:var(--ink);font-size:24px;cursor:pointer;padding:4px 8px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;font-size:15px;color:var(--ink);background:#0f1730;border:2px solid var(--edge);padding:8px 14px;cursor:pointer;border-radius:3px}
.tab.on{background:var(--hi)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;overflow:auto;padding:2px}
.card{background:#0f1730;border:2px solid var(--edge);box-shadow:inset 0 0 0 2px #24365f;padding:8px;text-align:center;cursor:pointer;border-radius:3px;display:flex;flex-direction:column;align-items:center;gap:4px}
.card:hover{box-shadow:inset 0 0 0 2px var(--sky)}
.card canvas,.card .art{width:96px;height:64px;image-rendering:pixelated;background:linear-gradient(#1d6fa3,#0b2545);border:2px solid var(--edge)}
.card .art{display:flex;align-items:center;justify-content:center;font-size:34px}
.card .nm{font-weight:700;font-size:16px}
.card .pr{color:var(--gold);font-size:15px}
.card .ds{color:var(--mute);font-size:13px;line-height:1.25;white-space:pre-line}
.card .tag{font-size:12px;padding:1px 6px;border-radius:3px;background:#24365f;color:var(--sky)}
.card .tag.salt{color:#ffd1f0;background:#4a2350}
.card.lock{opacity:.55;cursor:default}
.card.lock canvas{filter:grayscale(1) brightness(.4)}
.card.poor .pr{color:var(--coral)}
.vdots{letter-spacing:3px;font-size:14px}
#fishPanel{position:absolute;left:18px;top:18px;width:230px;padding:10px;display:none;z-index:6;font-size:14px}
#fishPanel.open{display:block}
#fishPanel input{font:inherit;font-size:17px;font-weight:700;width:100%;background:#0a0f1f;color:var(--ink);border:2px solid var(--edge);padding:2px 6px}
.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0;gap:8px}
.row .meter{width:110px}
#fpSp{color:var(--sky)}
#fpNote{color:var(--mute);font-size:12px;line-height:1.3;margin:4px 0}
#welcome .sheet{width:min(440px,100%);text-align:center;font-size:17px;line-height:1.4}
#welcome .btn{margin:6px auto 0}
@media (max-width:640px){
 body{gap:6px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
 #hud,#bar{gap:4px;width:100%}
 .btn{flex:1;min-width:0;min-height:56px;padding:4px 2px;font-size:11px;border-width:2px}
 .btn .ic{font-size:22px}
 .chip{font-size:13px;padding:2px 5px;min-height:38px;gap:4px;border-width:2px;flex:1 1 auto;justify-content:center}
 .chip .ico{font-size:15px}
 .stat small{font-size:10px}
 .meter{width:34px}
 #goal{width:100%;font-size:13px;border-width:2px}
 #goal .meter{width:40px}
 #tankwrap{padding:5px;border-width:2px}
 #tools{top:9px;right:9px}
 .ibtn{width:36px;height:36px;font-size:16px}
 #fishPanel{left:8px;right:8px;width:auto;top:auto;bottom:8px}
 #banner{bottom:8px;font-size:12px;white-space:normal;width:calc(100% - 16px);justify-content:space-between}
 #toasts{top:8px;max-width:calc(100% - 96px)}
 .grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
 .card canvas,.card .art{width:80px;height:54px}
 .sheet{padding:10px;max-height:92dvh}
 .toast{font-size:13px}
}
@media (max-height:520px) and (orientation:landscape){
 body{gap:4px;padding-top:max(4px,env(safe-area-inset-top));padding-bottom:max(4px,env(safe-area-inset-bottom))}
 #hud{gap:4px}
 .chip{min-height:30px;font-size:13px;padding:1px 7px}
 .stat small{display:none}
 #goal{min-height:28px;font-size:12px}
 .btn{flex-direction:row;gap:6px;padding:3px 10px;font-size:12px;min-height:40px}
 .btn .ic{font-size:18px}
 #tankwrap{padding:4px}
 #fishPanel{left:8px;right:auto;top:8px;bottom:auto;width:210px;font-size:12px;padding:6px}
}
@media (prefers-reduced-motion:reduce){#goal.done,#tankwrap.bump{animation:none}}
</style>
</head>
<body>
<div id="hud">
  <div class="px chip" title="Coins and income per minute"><span class="ico">🪙</span><div class="stat"><span id="coins">0</span><small id="rate">+0/min</small></div></div>
  <div class="px chip" title="Level and XP"><div class="stat"><span>LV <span id="lvl">1</span></span><div class="meter"><i id="xpb"></i></div></div></div>
  <div class="px chip" title="Fish in tank / capacity"><span class="ico">🐟</span><div class="stat"><span id="pop">0/8</span><small>fish</small></div></div>
  <div class="px chip" title="Water clarity: clean it when it turns green"><span class="ico">💧</span><div class="stat"><small>Water</small><div class="meter"><i id="wat"></i></div></div></div>
  <div class="px chip" title="Average fish happiness"><span class="ico">💗</span><div class="stat"><small>Mood</small><div class="meter"><i id="hap"></i></div></div></div>
</div>

<div id="goal" class="px" role="status"><span id="goalIc">🎯</span><span class="gtxt" id="goalTxt"></span><div class="meter"><i id="goalBar"></i></div><b id="goalRw"></b><button class="btn sm" id="goalClaim">Claim</button></div>

<div id="tankwrap">
  <canvas id="c" width="320" height="180" aria-label="Aquarium tank. Tap the water to drop food, tap or swipe coins to collect them, tap a fish to see it."></canvas>
  <div id="tools">
    <button class="ibtn" id="bLight" title="Light: auto / day / night" aria-label="Light mode"><span id="lightIc">💡</span></button>
    <button class="ibtn" id="bSound" title="Sound on/off" aria-label="Sound"><span id="soundIc">🔊</span></button>
  </div>
  <div id="banner" class="px"><span id="bannerTxt"></span><button class="btn sm" id="bannerSell" style="display:none">Sell</button><button class="btn sm" id="bannerBtn">Done</button></div>
  <div id="fishPanel" class="px" role="dialog" aria-label="Fish details">
    <input id="fpName" maxlength="14" aria-label="Fish name">
    <div class="row"><span id="fpSp"></span><span id="fpStage"></span></div>
    <div id="fpNote"></div>
    <div class="row">Hunger<div class="meter"><i id="fpHun"></i></div></div>
    <div class="row">Mood<div class="meter"><i id="fpMood"></i></div></div>
    <div class="row"><span>Age</span><span id="fpAge"></span></div>
    <div class="row"><button class="btn sm" id="fpSell">Sell</button><button class="btn sm" id="fpClose">Close</button></div>
  </div>
  <div id="toasts" aria-live="polite"></div>
</div>

<div id="bar">
  <button class="btn" id="bFeed" title="Drop a pinch of food"><span class="ic">🍤</span>Feed</button>
  <button class="btn" id="bClean" title="Clean the water"><span class="ic">🧽</span>Clean</button>
  <button class="btn" id="bShop" title="Buy fish, decor and upgrades"><span class="ic">🛒</span>Shop</button>
  <button class="btn" id="bEdit" title="Move or sell decorations"><span class="ic">🪴</span>Decor</button>
  <button class="btn" id="bDex" title="Your collection"><span class="ic">📖</span>Fishdex</button>
  <button class="btn" id="bPhoto" title="Save a photo of your tank"><span class="ic">📸</span>Photo</button>
</div>

<div class="modal" id="shop"><div class="sheet px">
  <h2>Reef Shop <small id="shopCoins"></small><button class="x" data-close aria-label="Close">✕</button></h2>
  <div class="tabs" id="shopTabs"></div>
  <div class="grid" id="shopGrid"></div>
</div></div>

<div class="modal" id="dex"><div class="sheet px">
  <h2>Fishdex <small id="dexCount"></small><button class="x" data-close aria-label="Close">✕</button></h2>
  <div class="grid" id="dexGrid"></div>
</div></div>

<div class="modal" id="welcome"><div class="sheet px">
  <h2 style="justify-content:center" id="welcomeTitle">Welcome back!</h2>
  <p id="welcomeTxt"></p>
  <button class="btn sm" data-close>Collect</button>
</div></div>

<script>
'use strict';
/* ============================================================
   PIXEL REEF — single-file aquarium game
   Art is generated from tiny pixel maps below. To swap in real
   assets later, add paths to ASSETS; anything listed there replaces
   the built-in pixel art automatically.
   ============================================================ */

// ---- Assets hook. Keys: fish_<species>, fry_<species>, decor_<id>, bg. Fish art must face RIGHT.
const ASSETS = {
  // fish_guppy: 'assets/guppy.png',
  // decor_castle: 'assets/castle.png',
  // bg: 'assets/background.png',
};

// Internal pixel resolution adapts to screen shape (landscape ~320x180, portrait ~170x300). SAND = top of sand.
let W = 320, H = 180, SAND = 150;
const SURF = 12, DAY = 480; // DAY = seconds per full day/night cycle
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hx = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const toHex = c => '#' + c.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hx(a), B = hx(b); return toHex(A.map((v, i) => lerp(v, B[i], t))); };
const seeded = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : String(Math.floor(n));

const NAMES = ['Bubbles','Mochi','Pearl','Sunny','Pebble','Coco','Bean','Waffle','Luna','Pip','Daisy','Miso','Biscuit','Tango','Kiwi','Peach','Nemo-ish','Ziggy','Boba','Noodle','Sprinkle','Chai','Gulab','Ladoo','Jalebi','Momo','Pani','Tofu','Wasabi','Comet','Marble','Fizz'];

// Pixel-map palette keys: b body, l belly, f fins, s accent (these get recolored by variants);
// d dark, w white, k eye, h highlight (fixed colors).
const BASE = { k: '#10121c', w: '#ffffff', d: '#2b2d42', h: '#ffffffcc' };

// Real fish are generated procedurally from `g` (shape, colors, fins, pattern) — see genFish().
// Critters (snail, crab, jelly, seahorse, turtle) use hand pixel maps.
const SPECIES = {
  guppy: { name: 'Guppy', lvl: 1, price: 15, coin: 2, speed: 26, desc: 'Tiny, cheerful, cheap.',
    g: { len: 11, ht: 6, tl: 9, th: 11, tail: 'fan', top: '#f08a4b', mid: '#ffa465', belly: '#ffe6c9', fin: '#4fa3ff', pat: '#ff5d8f', pattern: 'tailspots', dorsal: [.3, .6, 3] } },
  tetra: { name: 'Neon Tetra', lvl: 1, price: 25, coin: 3, speed: 30, school: 1, desc: 'Swims in schools.',
    g: { len: 14, ht: 5, tl: 5, th: 7, tail: 'fork', top: '#7d8f9c', mid: '#cfd9e0', belly: '#f2f5f7', fin: '#d5dee5', pat: '#2ef2ff', pat2: '#ff3d5e', pattern: 'neon', dorsal: [.42, .58, 2] } },
  goldfish: { name: 'Goldfish', lvl: 2, price: 40, coin: 5, speed: 20, desc: 'A classic for a reason.',
    g: { len: 15, ht: 11, tl: 11, th: 15, tail: 'veil', top: '#f06a00', mid: '#ff9020', belly: '#ffd28a', fin: '#ffb050', dorsal: [.35, .7, 4], ventral: [.45, .6, 2] } },
  snail: { name: 'Snail', lvl: 2, price: 30, coin: 1, speed: 4, kind: 'snail', desc: 'Munches algae. Cleaner water.',
    pal: { b: '#e9d8a6', l: '#d9c08a', f: '#e9d8a6', s: '#e76f51' },
    map: ['....sss.....k','..ssssssss..b','.sswwsssss.bb','.swsssswsssbb','.sssswssss.bb','..sssssss.bbb','lbbbbbbbbbbbl'] },
  clown: { name: 'Clownfish', lvl: 3, price: 70, coin: 8, speed: 22, home: 'anemone', desc: 'Loves anemones.',
    g: { len: 17, ht: 10, tl: 5, th: 9, tail: 'round', top: '#f25c00', mid: '#ff7b1c', belly: '#ffa04d', fin: '#ff8a2e', pattern: 'bands', bands: [.13, .48, .76], dorsal: [.2, .75, 3], ventral: [.45, .6, 2] } },
  angel: { name: 'Angelfish', lvl: 4, price: 110, coin: 12, speed: 16, desc: 'Tall, elegant, dramatic.',
    g: { len: 13, ht: 15, tl: 6, th: 10, tail: 'fork', shape: 'disc', top: '#cfc9b8', mid: '#ebe6d8', belly: '#fffaf0', fin: '#efe0b0', pattern: 'bars', bands: [.28, .52, .74], dorsal: [.15, .65, 9], ventral: [.3, .6, 10] } },
  crab: { name: 'Crab', lvl: 4, price: 80, coin: 4, speed: 12, kind: 'crab', desc: 'Eats leftovers off the sand.',
    pal: { b: '#e63946', l: '#ff8fa3', f: '#c22a36', s: '#e63946' },
    map: ['ff..w.....w..ff','ff..k.....k..ff','.f..b.....b..f.','.f.bbbbbbbbb.f.','..bbhbbbbbbbb..','..bbbbbbbbbbb..','...lllllllll...','..f.f.....f.f..','.f...f...f...f.'] },
  betta: { name: 'Betta', lvl: 5, price: 150, coin: 16, speed: 15, desc: 'Flowing royal fins.',
    g: { len: 14, ht: 7, tl: 12, th: 19, tail: 'veil', top: '#2e1760', mid: '#5b2a86', belly: '#8a4bb8', fin: '#c03fbf', pat: '#ff7ae0', pattern: 'betta', dorsal: [.15, .65, 7], ventral: [.25, .7, 7] } },
  puffer: { name: 'Pufferfish', lvl: 6, price: 220, coin: 22, speed: 13, desc: 'Tap it. Trust me.',
    g: { len: 15, ht: 13, tl: 4, th: 6, tail: 'round', shape: 'round', top: '#b8913f', mid: '#e9c46a', belly: '#fff5dc', fin: '#f4a261', pat: '#6b4f1d', pattern: 'spots', eye: 4, dorsal: [.25, .4, 2] } },
  tang: { name: 'Blue Tang', lvl: 7, price: 300, coin: 30, speed: 24, desc: 'Just keeps swimming.',
    g: { len: 19, ht: 12, tl: 6, th: 11, tail: 'fork', top: '#1248b8', mid: '#2272f0', belly: '#56a0f5', fin: '#ffd60a', dorsalCol: '#0d3b9e', pat: '#0b1d4d', pattern: 'tang', dorsal: [.1, .8, 3], ventral: [.2, .55, 3] } },
  jelly: { name: 'Moon Jelly', lvl: 8, price: 380, coin: 36, speed: 8, kind: 'jelly', desc: 'Glows at night.',
    pal: { b: '#ffb3f5', l: '#f368e0', f: '#ff9ff3', s: '#ffd6fa' },
    map: ['...bbbbb...','.bbhhbbbbb.','bbhbbsbbbbb','bbbbsssbbbb','bbkbbbbbkbb','bbbbblbbbbb','lblblblblbl'] },
  koi: { name: 'Koi', lvl: 9, price: 480, coin: 45, speed: 18, desc: 'Brings good luck.',
    g: { len: 22, ht: 8, tl: 9, th: 13, tail: 'veil', top: '#f2f2f2', mid: '#ffffff', belly: '#f5efe8', fin: '#ffe8d6', pat: '#ff5a1f', pat2: '#1d1d1d', pattern: 'patch', seed: 3, dorsal: [.3, .7, 3] } },
  horse: { name: 'Seahorse', lvl: 10, price: 600, coin: 55, speed: 7, kind: 'horse', desc: 'Hangs out by plants.',
    pal: { b: '#ffb703', l: '#ffe08a', f: '#fb8500', s: '#ffd166' },

// ---------------- Sprite baking ----------------
const IMG = {}, SPR = {};
let bgDirty = true;
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// Soft outline: each edge pixel takes a darkened copy of its neighbour's color (selective outlining).
function outline(c, k = .4) {
  const g = c.getContext('2d'), w = c.width, h = c.height, d = g.getImageData(0, 0, w, h).data;
  const out = g.createImageData(w, h), o = out.data;
  o.set(d);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (d[i + 3] > 100) continue;
    for (const [nx, ny] of [[x, y + 1], [x, y - 1], [x - 1, y], [x + 1, y]]) {
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const j = (ny * w + nx) * 4;
      if (d[j + 3] <= 100) continue;
      o[i] = d[j] * k; o[i + 1] = d[j + 1] * k; o[i + 2] = d[j + 2] * k + 12; o[i + 3] = Math.max(d[j + 3], 200);
      break;
    }
  }
  g.putImageData(out, 0, 0);
  return c;
}

// Gives flat pixel shapes volume: lit top-left edges, shaded bottom-right edges, darker toward the base.
function autoShade(c, k = .2) {
  const g = c.getContext('2d'), w = c.width, h = c.height, im = g.getImageData(0, 0, w, h), d = im.data, src = d.slice();
  const A = (x, y) => x >= 0 && y >= 0 && x < w && y < h && src[(y * w + x) * 4 + 3] > 100;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (src[i + 3] <= 100) continue;
    let f = (.5 - y / h) * k;
    if (!A(x, y - 1) || !A(x - 1, y)) f += k * .9; else if (!A(x, y - 2) || !A(x - 2, y)) f += k * .35;
    if (!A(x, y + 1) || !A(x + 1, y)) f -= k * .9; else if (!A(x + 2, y) || !A(x, y + 2)) f -= k * .35;
    for (let j = 0; j < 3; j++) d[i + j] = f > 0 ? d[i + j] + (255 - d[i + j]) * f : d[i + j] * (1 + f);
  }
  g.putImageData(im, 0, 0);
  return c;
}

function bakeMap(rows, pal, vfn = c => c) {
  const w = Math.max(...rows.map(r => r.length)) + 2, h = rows.length + 2, c = canvas(w, h), g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    let col = pal[ch] || BASE[ch];
    if (!col) return;
    if ('blfs'.includes(ch)) col = vfn(col);
    R(g, x + 1, y + 1, 1, 1, col);
  }));
  return outline(autoShade(c, .16));
}

function fromImage(img, filter = 'none') {
  const c = canvas(img.width, img.height), g = c.getContext('2d');
  g.filter = filter; g.drawImage(img, 0, 0);
  return c;
}

// ---- Procedural fish painter: shaded body, gloss, scales, gill, fins with rays, big cute eye + blush.
// Returns a canvas with .tail (tail width, for the swim wave) and .eye/.lid (for blinking).
function genFish(o, vfn = c => c) {
  const P = k => o[k] ? hx(vfn(o[k])) : null;
  const top = P('top'), mid = P('mid'), bel = P('belly'), fin = P('fin'), dor = P('dorsalCol') || fin, pc = P('pat'), pc2 = P('pat2');
  const L = o.len, BH = o.ht, TL = o.tl, TH = o.th || BH;
  const up = Math.ceil(Math.max(o.dorsal ? o.dorsal[2] : 0, (TH - BH) / 2)) + 1;
  const dn = Math.ceil(Math.max(o.ventral ? o.ventral[2] : 0, (TH - BH) / 2)) + (o.tail === 'veil' ? 3 : 1);
  const w = TL + L + 2, h = BH + up + dn + 2, x0 = TL + 1, cy = 1 + up + BH / 2;
  const c = canvas(w, h), g = c.getContext('2d'), img = g.createImageData(w, h), d = img.data;
  const lerpC = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  const shade = (rgb, f) => rgb.map(v => f > 0 ? v + (255 - v) * f : v * (1 + f));
  const set = (x, y, rgb, a = 255) => { if (x < 0 || y < 0 || x >= w || y >= h) return; const i = (y * w + x) * 4; d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2]; d[i + 3] = a; };
  const blend = (x, y, rgb, t) => { const i = (y * w + x) * 4; if (!d[i + 3]) return; set(x, y, lerpC([d[i], d[i + 1], d[i + 2]], rgb, t), d[i + 3]); };
  const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7 + (o.seed || 1) * 17.3) * 43758.5453; return s - Math.floor(s); };
  const prof = t => {
    if (o.shape === 'disc' || o.shape === 'round') return Math.max(t < .5 ? .25 : 0, Math.sqrt(Math.max(0, 1 - ((t - .5) / .5) ** 2)));
    return t < .62 ? Math.pow(Math.sin(t / .62 * Math.PI / 2), .8) * .82 + .18 : Math.pow(Math.cos((t - .62) / .38 * Math.PI / 2), .55);
  };
  const half = x => BH / 2 * prof((x - x0 + .5) / L);

  // tail (x = 1 is the tip, x = TL touches the body)
  for (let x = 1; x <= TL; x++) {
    const u = (x0 - x) / TL, ccy = cy + (o.tail === 'veil' ? u * TH * .12 : 0);
    const hs = o.tail === 'fork' ? 1 + u * TH / 2 : o.tail === 'round' ? 1 + Math.sin(u * Math.PI * .85) * TH / 2 : 1 + Math.pow(u, o.tail === 'veil' ? .6 : .7) * TH / 2;
    for (let y = Math.floor(ccy - hs); y <= Math.ceil(ccy + hs); y++) {
      const dy = y + .5 - ccy, ad = Math.abs(dy), r = ad / (TH / 2);
      if (ad > hs || (o.tail === 'fork' && u > .4 && ad < (u - .4) * TH * .8)) continue;
      if ((o.tail === 'fan' || o.tail === 'veil') && u > 1 - .35 * Math.pow(o.tail === 'veil' && dy > 0 ? r * .45 : r, 1.6)) continue; // rounded, flowing edge
      let col = shade(fin, ((y & 1) ? -.07 : .03) + u * .16 - (u < .3 ? .14 : 0)); // darker at the root, lighter at the tips
      if (o.pattern === 'tailspots' && hash(x, y) > .72) col = pc;
      if (o.pattern === 'betta' && y % 3 === 0) col = lerpC(col, pc, .5);
      set(x, y, col, 235 - u * 60);
    }
  }
  // dorsal / ventral fins
  const finAt = (spec, isUp, col) => {
    if (!spec) return;
    const [t0, t1, fh, st] = spec;
    for (let x = x0; x < x0 + L; x++) {
      const t = (x - x0 + .5) / L;
      if (t < t0 || t > t1) continue;
      const s = (t - t0) / (t1 - t0);
      if (st === 'spiky' && (x & 1)) continue; // lionfish: separate spines, no webbing
      const f = st === 'spiky' ? fh * (.5 + .5 * Math.sin(s * Math.PI)) : fh * (s > .7 ? (1 - s) / .3 * .9 + .1 : .45 + .55 * s / .7);
      const edge = isUp ? Math.floor(cy - half(x)) : Math.ceil(cy + half(x)) - 1;
      for (let k = 1; k <= Math.round(f); k++) {
        let cc = shade(col, ((x & 1) ? -.1 : .04) + (k >= Math.round(f) ? .15 : 0) + (k <= 1 ? -.12 : 0));
        if (o.pattern === 'betta' && k % 3 === 0) cc = lerpC(cc, pc, .5);
        if (st === 'spiky' && (k & 1)) cc = lerpC(cc, [255, 240, 230], .5);
        set(x, isUp ? edge - k : edge + k, cc, 215);
      }
    }
  };
  finAt(o.dorsal, true, dor);
  finAt(o.ventral, false, fin);

  // body
  const pattern = (col, x, y, t, v) => {
    switch (o.pattern) {
      case 'neon': if (v > .34 && v < .56 && t > .12 && t < .9) return lerpC(pc, [255, 255, 255], v > .4 && v < .46 ? .35 : 0); if (v >= .56 && t < .55) return pc2; return col;
      case 'bands': for (const b of o.bands) { const dd = Math.abs(t - b); if (dd < .065) return [255, 255, 255]; if (dd < .095) return [22, 20, 28]; } return col;
      case 'bars': for (const b of o.bands) if (Math.abs(t - b) < .045) return lerpC(col, [40, 40, 55], .85); return col;
      case 'spots': return hash(x, y) > .8 && v < .6 ? pc : col;
      case 'patch': { const n = Math.sin(x * .55 + o.seed) + Math.sin(y * .9 + x * .2 + o.seed * 2) + Math.sin((x - y) * .37); if (n > .9 && v < .85) return pc; if (pc2 && hash(x, y) > .95 && v < .55) return pc2; return col; }
      case 'lion': return (x + Math.round(v * 4)) % 3 === 0 ? [255, 238, 232] : col;
      case 'tang': { const cv = .38 + .22 * Math.sin((t - .1) * 3.3); return v > cv - .15 && v < cv + .1 && t > .1 && t < .8 ? pc : col; }
    }
    return col;

  for (let x = x0; x < x0 + L; x++) {
    const t = (x - x0 + .5) / L, hh = half(x);
    for (let y = Math.floor(cy - hh); y < Math.ceil(cy + hh); y++) {
      const dy = y + .5 - cy;
      if (Math.abs(dy) > hh + .01) continue;
      const v = (dy + hh) / (2 * hh || 1);
      let col = pattern(v < .5 ? lerpC(top, mid, v * 2) : lerpC(mid, bel, (v - .5) * 2), x, y, t, v);
      const ny = dy / (hh || 1);
      let f = -ny * .2 + (t - .5) * .1;                                    // light from above-front
      if (ny > -.8 && ny < -.4 && t > .25 && t < .85) f += .12;            // glossy band
      if (ny > -.75 && ny < -.45 && Math.abs(t - .66) < 1.6 / L) f += .3;  // specular glint

// ---------------- Breeding & visitors ----------------

  for (const sp in by) if (by[sp].length >= 2 && Math.random() < .3) {
    const [a, b] = by[sp].sort(() => Math.random() - .5);
    hearts(a.x, a.y); hearts(b.x, b.y);
    eggs.push({ sp, v: rollVariant(a, b), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, ry: rnd(SAND + 3, H - 5), t: 22 });

// ---------------- World tick ----------------

function update(dt) {

  for (const sp in SPECIES) if (SPECIES[sp].school) {
    const sc = school[sp] || (school[sp] = { x: W / 2, y: SAND / 2, tx: W / 2, ty: SAND / 2, t: 0 });
    if ((sc.t -= dt) <= 0) { sc.t = rnd(3, 7); sc.tx = rnd(30, W - 30); sc.ty = rnd(SURF + 20, SAND - 20); }
    sc.x += (sc.tx - sc.x) * dt * .5; sc.y += (sc.ty - sc.y) * dt * .5;
  }
  for (const f of fish) updateFish(f, dt, dk);
  for (let i = food.length - 1; i >= 0; i--) {
    const p = food[i];
    if (p.y < p.ry) { p.y = Math.min(p.ry, p.y + 9 * dt); p.x += Math.sin(T * 3 + p.ph) * .15; }

  }
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    if (c.y < c.ry) { c.y = Math.min(c.ry, c.y + 16 * dt); c.x += Math.sin(T * 2 + c.ph) * .2; }
    else { c.landed += dt; if ((S.up.magnet && c.landed > .5) || c.landed > 40) collect(c, true); }
  }
  for (let i = eggs.length - 1; i >= 0; i--) {

    const p = parts[i];

    if (p.k === 'poop' && p.y >= SAND + 2) { parts.splice(i, 1); if (poop.length < 50) poop.push({ x: p.x, y: rnd(SAND + 2, H - 4) }); S.dirt += .8; continue; }

    if (d.id === 'helmet' && Math.random() < dt * .6) bubble(d.x + 3, d.y - 17);
    if (d.id === 'chest') {

    }
  }
  if (Math.random() < dt * .8) bubble(rnd(0, W), SAND + 2);

  if ((timers.breed -= dt) <= 0) { timers.breed = 15; tryBreed(); }

  sec = sec < 60 ? 0 : Math.min(sec, 8 * 3600);
  let earn = 0;
  for (const f of fish) {
    const s = SPECIES[f.sp];
    f.age += sec;
    if (isAdult(f)) earn += s.coin * vmult(f) / 13 * sec * .25;
    f.hunger = Math.max(15, f.hunger - sec * .08);

  earn = Math.floor(earn);

  $('welcomeTxt').innerHTML = (sec ? `You were away for <b>${h ? h + 'h ' : ''}${m}m</b>.<br>Your fish made <b style="color:var(--gold)">🪙 ${fmt(earn)}</b> while you were gone!` : '') +

let AC = null, master = null, musicBus = null;
function audio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = S.sound ? .5 : 0; master.connect(AC.destination);
      startMusic();
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function tone(f, d = .12, type = 'sine', v = .15, when = 0, slide = 0, bus) {
  if (!AC || !S.sound) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(bus || master); o.start(t); o.stop(t + d + .05);
}
const SFX = {
  coin: (c = 1, v = .05) => { const k = 2 ** ((c - 1) / 6); tone(988 * k, .07, 'square', v); tone(1319 * k, .14, 'square', v, .06); }, // pitch climbs with the combo
  pearl: () => [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, .25, 'triangle', .08, i * .06)),
  plop: () => tone(520, .12, 'sine', .12, 0, .45),
  chomp: () => tone(300, .05, 'square', .04, 0, .6),
  buy: () => [523, 659, 784].forEach((f, i) => tone(f, .16, 'triangle', .1, i * .07)),
  level: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, 'square', .06, i * .09)),
  pet: () => tone(660, .18, 'triangle', .1, 0, 1.5),
  puff: () => tone(180, .3, 'sawtooth', .06, 0, 2.5),
  clean: () => { for (let i = 0; i < 10; i++) tone(rnd(400, 1300), .1, 'sine', .04, i * .05, 1.6); },
  error: () => tone(160, .18, 'sawtooth', .05),

// Gentle generative lo-fi: random notes from a 4-chord loop through a soft echo.
function startMusic() {
  musicBus = AC.createGain(); musicBus.gain.value = .1;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600;
  const dl = AC.createDelay(1); dl.delayTime.value = .45;
  const fb = AC.createGain(); fb.gain.value = .35;
  musicBus.connect(lp); lp.connect(master); lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(master);
  const chords = [[0, 4, 7, 11], [9, 12, 16, 19], [5, 9, 12, 16], [7, 11, 14, 17]];
  let beat = 0, bar = 0;
  setInterval(() => {
    if (!S.sound || document.hidden || AC.state !== 'running') return;
    if (++beat % 8 === 0) bar = (bar + 1) % chords.length;
    const root = darkness() > .5 ? 196 : 261.63, c = chords[bar];
    if (beat % 8 === 1) tone(root / 2 * 2 ** (c[0] / 12), 2.6, 'sine', .5, 0, 0, musicBus);
    if (Math.random() < .5) tone(root * 2 ** ((pick(c) + (Math.random() < .35 ? 12 : 0)) / 12), 1.3, 'triangle', .3, 0, 0, musicBus);

}

cv.addEventListener('pointermove', e => {
  const p = pos(e); pointer.x = p.x; pointer.y = p.y;
  if (drag && selDecor) { selDecor.x = clamp(p.x + drag.dx, 6, W - 6); selDecor.y = clamp(p.y + drag.dy, SAND + 4, H - 2); }
  else if (pointer.down && mode === 'play' && !placing) collectAt(p); // swipe to collect
});
let placeDrag = false;
const up = () => { pointer.down = false; drag = null; if (placing && placeDrag) place(pointer); placeDrag = false; };
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', () => { if (!pointer.down) pointer.x = -99; });

function place(p) {
  const D = DECOR[placing];
  if (S.coins < D.price) { toast('Not enough coins 🪙'); SFX.error(); placing = null; return banner(); }
  if (decor.length >= 30) { toast('Tank is full of decor! Sell something first.'); placing = null; return banner(); }
  S.coins -= D.price;
  const d = { id: placing, x: clamp(p.x, 6, W - 6), y: clamp(p.y, SAND + 4, H - 2), ph: rnd(0, 6), tm: 0 };
  decor.push(d); spark(d.x, d.y - 4, 10, '#fff8d6'); SFX.buy(); gainXP(Math.max(1, D.price / 10 | 0)); goal('place'); goal('buy');
  toast(D.name + ' placed! ✨'); placing = null; banner();
}
function banner() {
  const b = $('banner'), sellB = $('bannerSell');
  $('bEdit').classList.toggle('on', mode === 'edit');
  if (placing) { b.style.display = 'flex'; $('bannerTxt').textContent = 'Tap or drag in the tank to place ' + DECOR[placing].name; sellB.style.display = 'none'; $('bannerBtn').textContent = 'Cancel'; }
  else if (mode === 'edit') {
    b.style.display = 'flex';
    $('bannerTxt').textContent = selDecor ? DECOR[selDecor.id].name + ': drag to move' : 'Tap decor to select, drag to move';
    sellB.style.display = selDecor ? '' : 'none';
    if (selDecor) sellB.textContent = 'Sell 🪙' + (DECOR[selDecor.id].price >> 1);
    $('bannerBtn').textContent = 'Done';
  } else b.style.display = 'none';
}
$('bannerBtn').onclick = () => { placing = null; mode = 'play'; selDecor = null; banner(); };
$('bannerSell').onclick = () => {
  if (!selDecor) return;
  const v = DECOR[selDecor.id].price >> 1;
  S.coins += v; spark(selDecor.x, selDecor.y - 5, 10, '#ffd166');
  decor.splice(decor.indexOf(selDecor), 1); selDecor = null;
  SFX.coin(); toast('Sold for ' + v + ' coins'); banner();
};

// Toolbar
$('bFeed').onclick = () => { audio(); for (let i = 0; i < 6; i++) dropFood(rnd(16, W - 16), 1); SFX.plop(); };
$('bClean').onclick = () => {
  audio();
  const was = S.dirt; S.dirt = 0; poop.length = 0;
  for (let i = 0; i < 60; i++) bubble(rnd(4, W - 4), rnd(SAND - 20, H), 1);
  SFX.clean(); goal('clean');
  if (was > 20) { gainXP(4); toast('✨ Sparkling clean! Fish feel better.'); } else toast('✨ Already sparkling!');
};
let flashT = 0;
$('bPhoto').onclick = () => {
  audio();
  const k = 4, out = canvas(W * k + 48, H * k + 104), g = out.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.fillStyle = '#24170e'; g.fillRect(0, 0, out.width, out.height);
  g.fillStyle = '#5c4330'; g.fillRect(12, 12, out.width - 24, H * k + 24);
  g.drawImage(cv, 24, 24, W * k, H * k);
  g.textBaseline = 'middle'; g.font = '700 34px "Pixelify Sans", monospace'; g.fillStyle = '#ffd166';
  g.fillText('Pixel Reef', 28, H * k + 70);
  g.textAlign = 'right'; g.font = '600 26px "Pixelify Sans", monospace'; g.fillStyle = '#9fb3c8';
  g.fillText(fish.length + ' fish · LV ' + S.lvl, out.width - 28, H * k + 70);
  flashT = .5; tone(1800, .05, 'square', .05); tone(1200, .08, 'square', .04, .05);
  out.toBlob(async b => {
    const file = new File([b], 'pixel-reef.png', { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: 'My Pixel Reef' });
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'pixel-reef.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
      toast('📸 Snap! Photo saved.'); goal('photo');
    } catch (e) { /* share sheet closed */ }
  });
};
$('bShop').onclick = () => { audio(); renderShop(); openModal('shop'); };
$('bEdit').onclick = () => { audio(); placing = null; mode = mode === 'edit' ? 'play' : 'edit'; selDecor = null; closePanel(); banner(); };
$('bDex').onclick = () => { audio(); renderDex(); openModal('dex'); };
$('bLight').onclick = () => { S.light = (S.light + 1) % 3; lightBtn(); };
$('bSound').onclick = () => { audio(); S.sound = S.sound ? 0 : 1; if (master) master.gain.value = S.sound ? .5 : 0; soundBtn(); };
function lightBtn() { $('lightIc').textContent = ['💡', '☀️', '🌙'][S.light]; $('bLight').title = 'Light: ' + ['auto day/night', 'always day', 'always night'][S.light]; }
$('goal').onclick = claimGoal;
$('goalClaim').onclick = e => { e.stopPropagation(); claimGoal(); };
function soundBtn() { $('soundIc').textContent = S.sound ? '🔊' : '🔇'; }

// Shop
function cardArt(draw, w = 48, h = 32) { const c = canvas(w, h), g = c.getContext('2d'); g.imageSmoothingEnabled = false; draw(g, w, h); return c; }
function fitSprite(g, img, w, h, bottom) {
  const s = Math.max(1, Math.floor(Math.min((w - 4) / img.width, (h - 4) / img.height)));
  g.drawImage(img, (w - img.width * s) / 2 | 0, bottom ? h - 2 - img.height * s : (h - img.height * s) / 2 | 0, img.width * s, img.height * s);
}
const artSprite = img => cardArt((g, w, h) => fitSprite(g, img, w, h));
function card({ art, name, price, desc, tag, lock, poor, onClick }) {
  const el = document.createElement('div');
  el.className = 'card' + (lock ? ' lock' : '') + (poor ? ' poor' : '');
  el.tabIndex = 0; el.setAttribute('role', 'button');
  if (typeof art === 'string') { const a = document.createElement('div'); a.className = 'art'; a.textContent = art; el.append(a); } else el.append(art);
  for (const [cls, txt] of [['nm', name], ['pr', price], ['ds', desc]]) { const d = document.createElement('div'); d.className = cls; d.textContent = txt; el.append(d); }
  if (tag) { const t = document.createElement('div'); t.className = 'tag' + (tag === 'salt' ? ' salt' : ''); t.textContent = tag === 'salt' ? '🌊 Saltwater' : '💧 Freshwater'; el.append(t); }
  el.onclick = onClick;
  el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); } };
  return el;
}
function renderShop() {
  $('shopCoins').textContent = '🪙 ' + fmt(S.coins) + ' · LV ' + S.lvl;
  const tabs = $('shopTabs'), grid = $('shopGrid');
  tabs.innerHTML = ''; grid.innerHTML = '';
  for (const [k, l] of [['fish', '🐠 Fish'], ['decor', '🪸 Decor'], ['up', '⚙️ Upgrades']]) {
    const b = document.createElement('button'); b.className = 'tab' + (shopTab === k ? ' on' : ''); b.textContent = l;
    b.onclick = () => { shopTab = k; renderShop(); }; tabs.append(b);
  }
  if (shopTab === 'fish') for (const [id, s] of Object.entries(SPECIES)) {
    if (s.visitor) continue;
    const lock = S.lvl < s.lvl;
    const r = fishRate(id);
    grid.append(card({ art: artSprite(fishSprite(id)), name: s.name, price: lock ? '🔒 LV ' + s.lvl : '🪙 ' + s.price, desc: s.desc + '\n≈' + (r < 10 ? r.toFixed(1) : Math.round(r)) + ' coins/min · ' + Math.max(1, Math.round(s.price / r)) + 'm payback', tag: INFO[id][0], lock, poor: !lock && S.coins < s.price, onClick: () => buyFish(id) }));
  }
  if (shopTab === 'decor') for (const [id, D] of Object.entries(DECOR)) {
    const lock = S.lvl < D.lvl;
    const art = cardArt((g, w, h) => D.plant && !IMG['decor_' + id] ? PLANTS[id](g, w / 2, h - 2, 0) : fitSprite(g, decorSprite(id), w, h, true));
    grid.append(card({ art, name: D.name, price: lock ? '🔒 LV ' + D.lvl : '🪙 ' + D.price, desc: D.desc + ' +' + D.beauty + ' beauty', lock, poor: !lock && S.coins < D.price, onClick: () => buyDecor(id) }));
  }
  if (shopTab === 'up') for (const [id, U] of Object.entries(UPGRADES)) {
    const lv = S.up[id], max = lv >= U.cost.length, cost = U.cost[lv];
    grid.append(card({ art: U.icon, name: U.name + ' ' + '★'.repeat(lv) + '☆'.repeat(U.cost.length - lv), price: max ? 'MAXED' : '🪙 ' + cost, desc: U.desc, poor: !max && S.coins < cost, onClick: () => buyUpgrade(id) }));
  }
}
function buyFish(id) {
  const s = SPECIES[id];
  if (S.lvl < s.lvl) { toast('Reach level ' + s.lvl + ' to unlock ' + s.name); return SFX.error(); }
  if (fish.length >= cap()) { toast('Tank is full! Get a Bigger Tank or sell a fish.'); return SFX.error(); }
  if (S.coins < s.price) { toast('Need ' + (s.price - S.coins) + ' more coins'); return SFX.error(); }
  S.coins -= s.price;
  const f = newFish(id, 'normal', isFloor(s) ? {} : { y: SURF + 6 });
  fish.push(f); dexAdd(id, 'normal'); gainXP(Math.max(1, s.price / 5 | 0)); goal('buyFish'); goal('buy');
  for (let i = 0; i < 12; i++) bubble(f.x + rnd(-6, 6), f.y + rnd(0, 6), 1);
  SFX.buy(); toast('Welcome, ' + f.name + ' the ' + s.name + '! 💖'); closeModals();
}
function buyDecor(id) {
  const D = DECOR[id];
  if (S.lvl < D.lvl) { toast('Reach level ' + D.lvl + ' to unlock ' + D.name); return SFX.error(); }
  if (S.coins < D.price) { toast('Need ' + (D.price - S.coins) + ' more coins'); return SFX.error(); }
  placing = id; mode = 'play'; selDecor = null; closeModals(); closePanel(); banner();
}
function buyUpgrade(id) {
  const U = UPGRADES[id], lv = S.up[id];
  if (lv >= U.cost.length) return;
  if (S.coins < U.cost[lv]) { toast('Need ' + (U.cost[lv] - S.coins) + ' more coins'); return SFX.error(); }
  S.coins -= U.cost[lv]; S.up[id]++; gainXP(10); SFX.buy(); goal('buy'); toast(U.icon + ' ' + U.name + ' upgraded!'); renderShop();
}

// Fishdex
const VCOL = { normal: '#9fb3c8', gold: '#ffd166', ghost: '#e0f2ff', midnight: '#8c7bff' };
function renderDex() {
  const grid = $('dexGrid'); grid.innerHTML = '';
  let got = 0, total = 0;
  for (const [id, s] of Object.entries(SPECIES)) {
    const found = S.dex[id] || [], vs = s.visitor ? ['normal'] : Object.keys(VARIANTS), known = found.length > 0;
    total += vs.length; got += found.length;
    const el = card({ art: artSprite(fishSprite(id, found.find(v => v !== 'normal') || 'normal')), name: known ? s.name : '???', price: '', desc: known ? s.desc : s.visitor ? 'A rare visitor...' : 'Unlocks at LV ' + s.lvl, lock: !known, onClick: () => {} });
    const dots = el.querySelector('.pr'); dots.className = 'vdots';
    dots.innerHTML = vs.map(v => `<span title="${VARIANTS[v].name}" style="color:${found.includes(v) ? VCOL[v] : '#2a3a5f'}">◆</span>`).join('');
    grid.append(el);
  }
  $('dexCount').textContent = got + ' / ' + total + ' found · income +' + Math.round(dexCount() * 3) + '% · fill a row of colors for a sticker prize!';
}

// Layout: pick an internal resolution that matches the screen shape, then scale up crisp.
function fit() {
  const small = innerWidth <= 640, frame = small ? 14 : 26;
  const aw = Math.max(160, innerWidth - (small ? 24 : 32) - frame);
  const ah = Math.max(140, innerHeight - $('hud').offsetHeight - $('goal').offsetHeight - $('bar').offsetHeight - (small ? 36 : 52) - frame);
  const asp = aw / ah, oW = W, oH = H, oS = SAND;
  // Short side shrinks on small screens so fish stay big enough to tap (~2x scale minimum).
  if (asp >= 1) { H = clamp(Math.round(ah / 2), 130, 180); W = clamp(Math.round(H * asp), 240, 400); }
  else { W = clamp(Math.round(aw / 2.3), 130, 170); H = clamp(Math.round(W / asp), 200, 340); }
  SAND = H - (H < 160 ? 24 : 30);
  let s = Math.min(aw / W, ah / H);
  if (s >= 3) s = Math.floor(s);
  scale = s;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  if (oW !== W || oH !== H) {
    cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;
    remap(oW, oH, oS); ALGAE = makeAlgae(); snow = makeSnow(); bgDirty = true;
  }
}
addEventListener('resize', fit);
if (document.fonts) document.fonts.ready.then(fit);

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.key !== 'Escape') return;
  if (document.querySelector('.modal.open')) closeModals();
  else if (placing || mode === 'edit') { placing = null; mode = 'play'; selDecor = null; banner(); }
  else closePanel();
});

let hiddenAt = 0, last = performance.now(), hudT = 0, dayT = 30;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); save(); }
  else if (hiddenAt) { offline((Date.now() - hiddenAt) / 1000); hiddenAt = 0; last = performance.now(); }
});
addEventListener('pagehide', save);

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt);
  render();
  if (flashT > 0) { ctx.fillStyle = `rgba(255,255,255,${flashT})`; ctx.fillRect(0, 0, W, H); flashT = Math.max(0, flashT - dt * 2); }
  if ((dayT -= dt) <= 0) { dayT = 30; const g = newDay(); if (g) { toast('🎁 New day! Gift +' + g + ' coins and 3 new goals', 'gold'); goalUI(); } }
  if ((hudT -= dt) <= 0) { hudT = .25; hud(); }
  requestAnimationFrame(frame);
}

// ---------------- Boot ----------------
fit();
ALGAE = makeAlgae(); snow = makeSnow();
const returning = load(), gift = newDay();
lightBtn(); soundBtn(); banner(); hud(); goalUI();
if (returning) offline((Date.now() - S.t) / 1000, gift);
else setTimeout(() => toast('🐟 Welcome to Pixel Reef! Follow the 👉 tips above the tank.'), 600);
requestAnimationFrame(frame);
</script>
</body>
